map $http_host $port {
        default 80;
        "~^[^\:]+:(?<p>\d+)$" $p;
}

map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
}

server {
        listen 80 default_server;
        listen [::]:80 default_server;

        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001] valid=300s; # Cloudflare
        resolver_timeout 5s;
        ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
        ssl_buffer_size 4k;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_certificate /etc/ssl/cert.pem;
        ssl_certificate_key /etc/ssl/key.pem;
        ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=63072000" always;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Port $port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 300s;
        proxy_read_timeout 3600s;
        client_header_timeout 300s;
        client_body_timeout 300s;
        send_timeout 300s;

        set_real_ip_from 172.20.0.0/16;
        real_ip_header X-Forwarded-For;

        root /home/appbox/public_html;

        index index.html index.php;

        server_name _;

        client_max_body_size 2000M;

        location = /appbox-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        }
        # Deny hidden files such as .htaccess and .htpasswd, except .well-known.
        location ~ /\.(?!well-known\/) {
            deny all;
        }

        location /wp-content/uploads {
            location ~ \.php$ {
                deny all;
            }
        }

        location ~* /(?:uploads|files)/.*\.php$ {
            deny all;
        }

        location / {
                # Keep WordPress pretty permalinks working.
                try_files $uri $uri/ /index.php?$args;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
                expires max;
                log_not_found off;
        }
}
